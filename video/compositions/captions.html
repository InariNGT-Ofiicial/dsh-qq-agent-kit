<template><style>@font-face{font-family:DSFont;src:url('assets/fonts/NotoSansSC.ttf')}*{box-sizing:border-box}#root{position:absolute;inset:0;font-family:DSFont;color:#17365e}.paper{position:absolute;inset:0;background:#f5faff}.rail{position:absolute;left:100px;top:78px;width:8px;height:75px;background:#2679d9}.chapter{position:absolute;left:135px;top:72px;font-size:42px;font-weight:700}.tag{position:absolute;right:120px;top:82px;font-size:28px;color:#3b5574}.shot{position:absolute;inset:0}.panel{position:absolute;left:110px;top:180px;width:1080px;height:720px;border:5px solid #17365e;background-size:200% 200%;background-repeat:no-repeat;overflow:hidden}.bubble{position:absolute;text-align:center;font-size:32px;line-height:1.3;font-weight:700;white-space:pre-line}.aside{position:absolute;left:1250px;top:195px;width:540px}.aside h2{font-size:62px;line-height:1.3;margin:0 0 28px;font-weight:800;white-space:pre-line}.aside p{font-size:33px;line-height:1.55;margin:0;white-space:pre-line}.speaker{position:absolute;left:1280px;top:455px;width:510px;height:455px;object-fit:contain;object-position:center bottom}.name{position:absolute;left:1510px;top:906px;font-size:28px;color:#3b5574}.accent{color:#2164b2}.screen{position:absolute;left:110px;top:180px;width:1080px;height:720px;background:#121212;border:5px solid #17365e;overflow:hidden}.screen img{position:absolute;max-width:none}.caption{position:absolute;left:230px;right:230px;top:953px;text-align:center;font-size:42px;line-height:1.25;color:#fff}.caption span{display:inline-block;background:#17365e;padding:10px 28px;border-radius:9px;max-width:100%}.banner{position:absolute;left:130px;right:130px;top:130px;font-size:36px;font-weight:700;text-align:center;color:#17365e;background:#ffdf7a;padding:15px}.demo{position:absolute;left:100px;top:242px;width:1720px;height:650px;object-fit:contain;background:#eef4fa;border:4px solid #17365e}.proof{position:absolute;left:145px;top:210px;width:1020px}.proof h2{font-size:60px;margin:0 0 34px}.proof p{font-size:42px;line-height:1.65;margin:10px 0}.note{font-size:28px!important;color:#3b5574}.ending{position:absolute;left:880px;top:190px;width:900px}.ending h2{font-size:58px;line-height:1.4;margin:0}.number{font-size:100px;font-weight:800;color:#2164b2;letter-spacing:3px;margin:25px 0}.ending p{font-size:38px;line-height:1.5}.ending .credits{font-size:25px;line-height:1.4}.endart{position:absolute;left:110px;top:300px;width:660px;height:440px;background-size:200% 200%;background-position:0% 100%;border:5px solid #17365e}.endart .bubble{left:4%;top:3%;width:35%;height:20%;display:grid;place-items:center;font-size:26px}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="Q00S00-c1" class="clip" data-start="0.000" data-duration="2.780" data-track-index="1"><div class="caption"><span>站内那些 DSH 接入 QQ 的教程</span></div></div><div id="Q00S00-c2" class="clip" data-start="2.790" data-duration="3.090" data-track-index="1"><div class="caption"><span>，动不动就是十几分钟、二十几分钟。</span></div></div><div id="Q00S01-c1" class="clip" data-start="5.890" data-duration="2.680" data-track-index="1"><div class="caption"><span>照着一步步操作，不仅慢，</span></div></div><div id="Q00S01-c2" class="clip" data-start="8.790" data-duration="2.070" data-track-index="1"><div class="caption"><span>最后还不一定验收通过。</span></div></div><div id="Q00S02-c1" class="clip" data-start="10.870" data-duration="1.050" data-track-index="1"><div class="caption"><span>而我们的方法，</span></div></div><div id="Q00S02-c2" class="clip" data-start="11.930" data-duration="1.970" data-track-index="1"><div class="caption"><span>只需要三秒钟——把交接包，</span></div></div><div id="Q00S02-c3" class="clip" data-start="13.910" data-duration="1.750" data-track-index="1"><div class="caption"><span>交给本地 Agent。</span></div></div><div id="Q00S03-c1" class="clip" data-start="15.670" data-duration="1.370" data-track-index="1"><div class="caption"><span>来，直接看操作。</span></div></div><div id="Q01S00-c1" class="clip" data-start="17.490" data-duration="2.270" data-track-index="1"><div class="caption"><span>拖进对话框，按下回车。</span></div></div><div id="Q01S01-c1" class="clip" data-start="20.280" data-duration="1.220" data-track-index="1"><div class="caption"><span>好，交接完成！</span></div></div><div id="Q01S02-c1" class="clip" data-start="22.020" data-duration="2.020" data-track-index="1"><div class="caption"><span>后面的活儿，让 Agent 接着干。</span></div></div><div id="Q02S00-c1" class="clip" data-start="25.170" data-duration="1.560" data-track-index="1"><div class="caption"><span>它会先检查你的电脑，</span></div></div><div id="Q02S00-c2" class="clip" data-start="26.750" data-duration="3.290" data-track-index="1"><div class="caption"><span>找到 QQ 和 DSH，再安装依赖、</span></div></div><div id="Q02S00-c3" class="clip" data-start="30.050" data-duration="1.920" data-track-index="1"><div class="caption"><span>生成配置、处理报错。</span></div></div><div id="Q02S01-c1" class="clip" data-start="32.190" data-duration="2.720" data-track-index="1"><div class="caption"><span>需要登录的时候，它会喊你拿手机扫码。</span></div></div><div id="Q02S02-c1" class="clip" data-start="34.990" data-duration="2.360" data-track-index="1"><div class="caption"><span>最后，还要检查账号是不是对的，</span></div></div><div id="Q02S02-c2" class="clip" data-start="37.390" data-duration="1.220" data-track-index="1"><div class="caption"><span>模型能不能回答，</span></div></div><div id="Q02S02-c3" class="clip" data-start="38.770" data-duration="1.720" data-track-index="1"><div class="caption"><span>消息能不能真正发回来。</span></div></div><div id="Q02S03-c1" class="clip" data-start="40.990" data-duration="3.727" data-track-index="1"><div class="caption"><span>三秒钟，完成的是交接；部署和验收，</span></div></div><div id="Q02S03-c2" class="clip" data-start="44.810" data-duration="2.120" data-track-index="1"><div class="caption"><span>交给 Agent 继续跑。</span></div></div><div id="Q03S00-c1" class="clip" data-start="47.730" data-duration="2.900" data-track-index="1"><div class="caption"><span>这次我们先把个人 QQ 小号这条线做</span></div></div><div id="Q03S00-c2" class="clip" data-start="50.640" data-duration="0.250" data-track-index="1"><div class="caption"><span>好。</span></div></div><div id="Q03S01-c1" class="clip" data-start="50.900" data-duration="2.420" data-track-index="1"><div class="caption"><span>本地能跑，也能搬到云端。</span></div></div><div id="Q03S02-c1" class="clip" data-start="53.520" data-duration="2.740" data-track-index="1"><div class="caption"><span>本地适合先试起来；上云以后，</span></div></div><div id="Q03S02-c2" class="clip" data-start="56.380" data-duration="0.980" data-track-index="1"><div class="caption"><span>你的电脑关了，</span></div></div><div id="Q03S02-c3" class="clip" data-start="57.460" data-duration="1.900" data-track-index="1"><div class="caption"><span>云端实例也可以继续工作。</span></div></div><div id="Q03S03-c1" class="clip" data-start="59.720" data-duration="2.410" data-track-index="1"><div class="caption"><span>至于 QQ 偶尔要求手机确认，</span></div></div><div id="Q03S03-c2" class="clip" data-start="62.140" data-duration="1.010" data-track-index="1"><div class="caption"><span>还是得本人来。</span></div></div><div id="Q03S04-c1" class="clip" data-start="63.160" data-duration="1.540" data-track-index="1"><div class="caption"><span>别把“服务启动了”，</span></div></div><div id="Q03S04-c2" class="clip" data-start="64.700" data-duration="1.760" data-track-index="1"><div class="caption"><span>当成“账号已经登录了”。</span></div></div><div id="Q04S00-c1" class="clip" data-start="67.180" data-duration="2.650" data-track-index="1"><div class="caption"><span>接上之后，总不能每次改个设置，</span></div></div><div id="Q04S00-c2" class="clip" data-start="69.990" data-duration="1.300" data-track-index="1"><div class="caption"><span>还要翻配置文件吧？</span></div></div><div id="Q04S01-c1" class="clip" data-start="71.510" data-duration="2.980" data-track-index="1"><div class="caption"><span>所以我又做了一个 DSH 中控插件。</span></div></div><div id="Q04S02-c1" class="clip" data-start="74.750" data-duration="3.170" data-track-index="1"><div class="caption"><span>打开插件设置，群聊总开关、消息落盘、</span></div></div><div id="Q04S02-c2" class="clip" data-start="77.930" data-duration="2.820" data-track-index="1"><div class="caption"><span>回复模式和冷却时间，都可以直接调整。</span></div></div><div id="Q04S03-c1" class="clip" data-start="81.090" data-duration="0.920" data-track-index="1"><div class="caption"><span>这里改开关，</span></div></div><div id="Q04S03-c2" class="clip" data-start="82.410" data-duration="1.980" data-track-index="1"><div class="caption"><span>不会把正在运行的 QQ 给退出去。</span></div></div><div id="Q05S00-c1" class="clip" data-start="85.230" data-duration="1.570" data-track-index="1"><div class="caption"><span>群消息落盘也搬过来了。</span></div></div><div id="Q05S01-c1" class="clip" data-start="87.880" data-duration="2.670" data-track-index="1"><div class="caption"><span>消息进来，先按授权群记录，</span></div></div><div id="Q05S01-c2" class="clip" data-start="90.560" data-duration="1.720" data-track-index="1"><div class="caption"><span>再判断要不要回复。</span></div></div><div id="Q05S02-c1" class="clip" data-start="93.180" data-duration="3.290" data-track-index="1"><div class="caption"><span>所以，就算现在是只在被艾特时说话，</span></div></div><div id="Q05S02-c2" class="clip" data-start="96.480" data-duration="1.560" data-track-index="1"><div class="caption"><span>没艾特她的文字，</span></div></div><div id="Q05S02-c3" class="clip" data-start="98.340" data-duration="1.910" data-track-index="1"><div class="caption"><span>也不会因为回复开关被漏掉。</span></div></div><div id="Q05S03-c1" class="clip" data-start="100.260" data-duration="3.490" data-track-index="1"><div class="caption"><span>记录留在私有目录，按群、按日期分开；</span></div></div><div id="Q05S03-c2" class="clip" data-start="103.760" data-duration="2.400" data-track-index="1"><div class="caption"><span>图片只记类型，不擅自下载。</span></div></div><div id="Q06S00-c1" class="clip" data-start="106.880" data-duration="3.550" data-track-index="1"><div class="caption"><span>想让她安静一点，就选“仅艾特回复”：</span></div></div><div id="Q06S00-c2" class="clip" data-start="110.770" data-duration="1.580" data-track-index="1"><div class="caption"><span>叫到她，她再接话。</span></div></div><div id="Q06S01-c1" class="clip" data-start="112.910" data-duration="3.120" data-track-index="1"><div class="caption"><span>想让她参与聊天，就切到“自主参与”：</span></div></div><div id="Q06S01-c2" class="clip" data-start="116.290" data-duration="3.100" data-track-index="1"><div class="caption"><span>不用每条都艾特，有新消息就可以接上。</span></div></div><div id="Q06S02-c1" class="clip" data-start="119.490" data-duration="3.220" data-track-index="1"><div class="caption"><span>不过，冷却时间和每小时上限照样生效。</span></div></div><div id="Q06S03-c1" class="clip" data-start="123.290" data-duration="2.860" data-track-index="1"><div class="caption"><span>你随时能关掉；哪怕她正在想回复，</span></div></div><div id="Q06S03-c2" class="clip" data-start="126.430" data-duration="2.160" data-track-index="1"><div class="caption"><span>发送之前也会再看一遍开关。</span></div></div><div id="Q07S00-c1" class="clip" data-start="129.110" data-duration="2.890" data-track-index="1"><div class="caption"><span>这套包不是把命令堆在一起就算交付。</span></div></div><div id="Q07S01-c1" class="clip" data-start="132.480" data-duration="3.470" data-track-index="1"><div class="caption"><span>我们保留了安装脚本、测试和恢复步骤，</span></div></div><div id="Q07S01-c2" class="clip" data-start="135.960" data-duration="3.140" data-track-index="1"><div class="caption"><span>还在独立目录重跑了镜像构建、</span></div></div><div id="Q07S01-c3" class="clip" data-start="139.320" data-duration="2.970" data-track-index="1"><div class="caption"><span>扫码入口、容器重启和模型调用。</span></div></div><div id="Q07S02-c1" class="clip" data-start="142.300" data-duration="1.110" data-track-index="1"><div class="caption"><span>现在这套中控，</span></div></div><div id="Q07S02-c2" class="clip" data-start="143.420" data-duration="3.350" data-track-index="1"><div class="caption"><span>也走的是 DSH 原生插件安装和设置</span></div></div><div id="Q07S02-c3" class="clip" data-start="146.780" data-duration="0.390" data-track-index="1"><div class="caption"><span>接口。</span></div></div><div id="Q07S03-c1" class="clip" data-start="147.180" data-duration="2.910" data-track-index="1"><div class="caption"><span>能不能用，看真实状态和消息验收，</span></div></div><div id="Q07S03-c2" class="clip" data-start="150.100" data-duration="2.170" data-track-index="1"><div class="caption"><span>不看一串漂亮的成功提示。</span></div></div><div id="Q08S00-c1" class="clip" data-start="152.720" data-duration="1.450" data-track-index="1"><div class="caption"><span>交接包交给 Agent，</span></div></div><div id="Q08S00-c2" class="clip" data-start="154.350" data-duration="1.550" data-track-index="1"><div class="caption"><span>你负责决定怎么用她。</span></div></div><div id="Q08S01-c1" class="clip" data-start="156.010" data-duration="1.650" data-track-index="1"><div class="caption"><span>如果你也想看看，</span></div></div><div id="Q08S01-c2" class="clip" data-start="157.670" data-duration="2.950" data-track-index="1"><div class="caption"><span>Agent 账号进入真实群聊以后，</span></div></div><div id="Q08S01-c3" class="clip" data-start="160.630" data-duration="1.090" data-track-index="1"><div class="caption"><span>会发生什么，</span></div></div><div id="Q08S01-c4" class="clip" data-start="161.730" data-duration="3.170" data-track-index="1"><div class="caption"><span>欢迎加入我们的 Agent 账号社会</span></div></div><div id="Q08S01-c5" class="clip" data-start="164.910" data-duration="2.680" data-track-index="1"><div class="caption"><span>实验群：小肥鱼幼儿园一班。</span></div></div><div id="Q08S02-c1" class="clip" data-start="167.910" data-duration="1.300" data-track-index="1"><div class="caption"><span>群号已经放在画面上。</span></div></div><div id="Q08S03-c1" class="clip" data-start="169.250" data-duration="1.600" data-track-index="1"><div class="caption"><span>来一起搭建、观察，</span></div></div><div id="Q08S03-c2" class="clip" data-start="170.850" data-duration="2.040" data-track-index="1"><div class="caption"><span>也一起把这套方法做得更好用。</span></div></div></div><script>window.__timelines["captions"]=gsap.timeline({paused:true});</script></template>
