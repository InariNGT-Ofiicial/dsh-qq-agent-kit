ass="clip" data-start="46.690" data-duration="2.420" data-track-index="1"><div class="caption"><span>官方 bot 云端、QQ 小号本地、</span></div></div><div id="Q02S05-c3" class="clip" data-start="49.510" data-duration="1.390" data-track-index="1"><div class="caption"><span>QQ 小号云端。</span></div></div><div id="Q02S06-c1" class="clip" data-start="50.910" data-duration="2.140" data-track-index="1"><div class="caption"><span>选好一条，告诉 Agent</span></div></div><div id="Q02S06-c2" class="clip" data-start="53.130" data-duration="1.640" data-track-index="1"><div class="caption"><span>它就按对应路线开工。</span></div></div><div id="Q03S00-c1" class="clip" data-start="55.730" data-duration="2.830" data-track-index="1"><div class="caption"><span>Agent 会检查环境、安装依赖、</span></div></div><div id="Q03S00-c2" class="clip" data-start="58.680" data-duration="3.060" data-track-index="1"><div class="caption"><span>生成配置，再把模型和 QQ 接起来。</span></div></div><div id="Q03S01-c1" class="clip" data-start="62.120" data-duration="2.940" data-track-index="1"><div class="caption"><span>轮到扫码的时候，它会叫你拿手机确认。</span></div></div><div id="Q03S02-c1" class="clip" data-start="65.280" data-duration="3.563" data-track-index="1"><div class="caption"><span>接着发条消息，收到回复，就完成验收。</span></div></div><div id="Q03S03-c1" class="clip" data-start="69.100" data-duration="2.700" data-track-index="1"><div class="caption"><span>本地可以马上试起来；搬到云端</span></div></div><div id="Q03S03-c2" class="clip" data-start="71.980" data-duration="2.120" data-track-index="1"><div class="caption"><span>你关掉电脑，她也能继续聊天。</span></div></div><div id="Q04S00-c1" class="clip" data-start="76.030" data-duration="0.820" data-track-index="1"><div class="caption"><span>接上之后</span></div></div><div id="Q04S00-c2" class="clip" data-start="77.030" data-duration="2.040" data-track-index="1"><div class="caption"><span>打开 DSH 的 QQ 中控</span></div></div><div id="Q04S00-c3" class="clip" data-start="79.330" data-duration="3.040" data-track-index="1"><div class="caption"><span>就能直接调整群聊开关、消息落盘、</span></div>
